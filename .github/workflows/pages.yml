name: pages
# The site is main's tree, served as it stands (.nojekyll), with the animated
# gallery added from the media branch. The GIFs are not on main: 96 MB of them
# rode along in every clone and every regeneration added another copy to the
# history. media holds one commit, replaced when the gallery is remade (make
# publish-gifs), so it never grows.
on:
  # After ci, not on the push itself: ci's tinygo job publishes the wasm
  # builds, and the site serves the wasm, so the deploy waits for them.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # make publish-gifs, and anyone by hand. Not a push to media: the Pages
  # environment deploys from the default branch only.
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # main as it is now, which includes the refresh commit ci just pushed.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/checkout@v5
        with:
          ref: media
          path: _media
      - name: add the gallery
        run: |
          mkdir -p docs/img/gif
          cp _media/docs/img/gif/*.gif docs/img/gif/
          # The models' loops, beside their stills in docs/img/model.
          if ls _media/docs/img/model/*.gif >/dev/null 2>&1; then cp _media/docs/img/model/*.gif docs/img/model/; fi
          rm -rf _media
      - name: add the wasm builds
        # They are not in the repository: the ci workflow publishes them as
        # assets of the "wasm" release, a bundle a commit. This commit's, or
        # the newest where it has none (a ci run that failed before it built
        # them): the pages ask for the wasm by the stamp beside it, so an
        # older build is still a page that runs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mine="chaosrack-wasm-$(git rev-parse --short=12 HEAD).tar.gz"
          if ! gh release download wasm --repo "$GITHUB_REPOSITORY" -p "$mine" -O wasm.tar.gz; then
            echo "::warning::no wasm bundle for this commit ($mine); deploying the newest"
            gh release download wasm --repo "$GITHUB_REPOSITORY" -p chaosrack-wasm.tar.gz -O wasm.tar.gz
          fi
          tar -xzf wasm.tar.gz -C assets
          rm wasm.tar.gz
          ls -l assets/gowasm/chaosrack.wasm assets/tinywasm/chaosrack-tiny.wasm assets/metersworker/meters.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
