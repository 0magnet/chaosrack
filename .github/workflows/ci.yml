name: ci
on:
  push:
    # The branch is main. This said master, so nothing below had ever run on a
    # push — only on pull requests, of which this repository has none.
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The TinyGo artifact is rebuilt and committed by the tinygo job below,
      # so its staleness test has nothing to tell anyone here: it would go red
      # on every push that touches a source file and green a few minutes later
      # on the refresh commit, which is how a red build stops meaning anything.
      # On a pull request the variable is empty and the test runs, because
      # there no refresh can happen — and it always runs locally, which is
      # where the forgetting it catches actually happens.
      TINYWASM_REFRESHED_BY_CI: ${{ github.event_name == 'push' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Native tests cover the untagged pure logic (LED formatting, pitch
      # mapping, pose decomposition, splines, equation parser).
      - run: go test ./...
      # Compile gate for the js/wasm-tagged app (most of the codebase) — a
      # wasm-only compile error is otherwise invisible until `make wasms`.
      - run: GOOS=js GOARCH=wasm go build ./cmd/wasm

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install golangci-lint
        # The installer is taken at the same tag as the binary it installs.
        # Fetching it from master broke every run here: that script matches the
        # checksums file by prefix, so for a release that also publishes an
        # SBOM it reads the hash of golangci-lint-*.tar.gz.sbom.json and then
        # rejects a download that was in fact correct. Pinning also means CI
        # stops running whatever happens to be on a branch today.
        env:
          GOLANGCI_VERSION: v2.12.2
        run: |
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_VERSION}/install.sh" |
            sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_VERSION}"
      # Two passes: host config for the tools/server, GOOS=js for the app
      # (the default pass never loads //go:build js && wasm files).
      - run: make lint

  tinygo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: "0.41.1"
      # The TinyGo build has different stdlib coverage than big Go, so this is
      # the only automated check that the dual-toolchain support still holds —
      # and now it is also where the committed artifact comes from.
      #
      # `make tinywasm` rather than a bare tinygo build: it takes the source
      # fingerprint before compiling and writes it after, and it fixes up the
      # wasm_exec.js it copies. The build runs for several minutes at -opt=2
      # and about twenty at -opt=z, which is the whole reason nobody ran it by
      # hand and the artifact went stale twice.
      - run: make tinywasm
      - name: commit the refreshed artifact
        # Only on a push to main: a pull request build has nothing it may push
        # to, and one from a fork does not have the token either. A stale
        # artifact on a PR stays a failing test, which is the right answer
        # there — the contributor is being told what their branch is missing.
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- assets/tinywasm; then
            echo "artifact already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tinywasm
          # [skip ci] because this commit cannot change any outcome: the
          # fingerprint is taken from the sources, and this changes only the
          # artifact built from them.
          git commit -m "assets: refresh the TinyGo wasm [skip ci]"
          git push
