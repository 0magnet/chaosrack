name: ci
on:
  push:
    # The branch is main. This said master, so nothing below had ever run on a
    # push — only on pull requests, of which this repository has none.
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      # Native tests cover the untagged pure logic (LED formatting, pitch
      # mapping, pose decomposition, splines, equation parser).
      - run: go test ./...
      # Compile gate for the js/wasm-tagged app (most of the codebase) — a
      # wasm-only compile error is otherwise invisible until `make wasms`.
      - run: GOOS=js GOARCH=wasm go build -o /dev/null .

  # The js/wasm tests, under Node. The test job above cannot compile a _js.go
  # file, so the 285 tests beside the browser half of the app ran only when
  # somebody typed `make test-wasm`. A job of its own because pkg/attractor
  # alone takes minutes here, and the host tests should not wait on it.
  #
  # go test directly rather than the make target: that one skips, and exits 0,
  # where Node or the exec wrapper is missing, which is right on a laptop and
  # would be a green run that tested nothing here.
  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: |
          exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec"
          test -x "$exec"
          CGO_ENABLED=0 GOOS=js GOARCH=wasm go test -timeout 30m -exec="$exec" ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: install golangci-lint
        # The installer is taken at the same tag as the binary it installs.
        # Fetching it from master broke every run here: that script matches the
        # checksums file by prefix, so for a release that also publishes an
        # SBOM it reads the hash of golangci-lint-*.tar.gz.sbom.json and then
        # rejects a download that was in fact correct. Pinning also means CI
        # stops running whatever happens to be on a branch today.
        env:
          GOLANGCI_VERSION: v2.14.0
        run: |
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_VERSION}/install.sh" |
            sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_VERSION}"
      # Two passes: host config for the tools/server, GOOS=js for the app
      # (the default pass never loads //go:build js && wasm files).
      - run: make lint
      # The README's generated regions are built from the app's own catalog,
      # model descriptions and module tooltips. Nothing checked they still
      # matched, and they had drifted a long way: the descriptions had been
      # rewritten underneath the file, and the module reference listed 23 of
      # the rack's 35 modules. This is the check that would have caught it.
      - run: make readme-check

  tinygo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Both builds with the newest Go, as every other job here; go.mod's line
      # is the floor this module needs, not the toolchain to ship with. The
      # TinyGo build too: the fork's develop takes Go up to 1.27.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: make wasm metersworker
      # The 0magnet/tinygo toolchain (develop, rebuilt on every push there),
      # not a release: it has the fixes this build depends on — finished
      # goroutine stacks handed back (tinygo-org/tinygo fb9b49d6; before it
      # every JS callback, ~290 a second here, took a fresh 64 KB stack and
      # each collection stopped the page for 120–150 ms); since fc63e634 those
      # stacks are kept and reused and the heap grows a quarter at a time
      # instead of doubling, and since e124cd4f syscall/js keeps a call's
      # arguments on the stack and gives short-lived references no finalizer
      # (254 → 3.7 MB allocated a minute, 8 → 3 collections, 79 → 23 MB of
      # wasm memory). interp no longer prints IR for errors it discards, and
      # Binaryen is 133.
      - name: install TinyGo
        id: tinygo
        run: |
          curl -sSfL -o "$RUNNER_TEMP/tinygo.tar.gz" https://github.com/0magnet/tinygo/releases/download/toolchain/tinygo.linux-amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/tinygo.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"
          echo "sha=$(sha256sum "$RUNNER_TEMP/tinygo.tar.gz" | cut -c1-16)-$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      # TinyGo's package cache, from the last run with this same toolchain:
      # every package an unchanged dependency, the standard library and most
      # of this module, compiled already. Measured on mainframe, a warm cache
      # takes this build from 688 s to 462 s, byte-identical. Keyed on the
      # tarball's hash and not its version, which stays put while develop is
      # rebuilt under it: a cache from an older compiler would hand this one
      # code it did not make. And on the Go: a new Go is a new standard
      # library, none of it cached. A new key each run, so the newest is kept.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tinygo
          key: tinygo-${{ steps.tinygo.outputs.sha }}-${{ github.run_id }}
          restore-keys: tinygo-${{ steps.tinygo.outputs.sha }}-
      - run: tinygo version
      # The TinyGo build has different stdlib coverage than big Go, so this is
      # the only automated check that the dual-toolchain support still holds —
      # and it is also where the published builds come from.
      #
      # The make targets rather than bare builds: they take the source
      # fingerprint before compiling and write it after, and fix up the
      # wasm_exec.js they copy. The TinyGo build runs for several minutes at
      # -opt=2 and about twenty at -opt=z, which is the whole reason nobody ran
      # it by hand and the artifact went stale twice.
      #
      - run: make tinywasm
      - name: publish the builds
        # As assets of the rolling "wasm" release, where they were commits on
        # main: 57 MB a push, 1.2 GB of history in seven weeks, and a push
        # from this job that raced whoever pushed next. Two names for one
        # bundle: by this commit, which is what a binary built from it asks
        # for (pkg/wasmfetch) and what the pages workflow deploys, and the
        # newest, for a binary whose commit has none.
        #
        # Only on a push to main: a pull request build has nothing it may
        # publish, and one from a fork does not have the token either.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -czf chaosrack-wasm.tar.gz -C assets \
            gowasm/chaosrack.wasm gowasm/wasm_exec.js gowasm/built-from.txt \
            tinywasm/chaosrack-tiny.wasm tinywasm/tinygo_wasm_exec.js tinywasm/built-from.txt \
            metersworker/meters.wasm metersworker/worker.js
          mine="chaosrack-wasm-${GITHUB_SHA::12}.tar.gz"
          cp chaosrack-wasm.tar.gz "$mine"
          gh release view wasm >/dev/null 2>&1 || gh release create wasm --prerelease \
            --title "wasm builds" \
            --notes "The page's wasm builds, published by CI on every push to main: one bundle a commit, and chaosrack-wasm.tar.gz, the newest. A chaosrack binary built without them fetches its own from here."
          # This commit's first: a run that dies between the two leaves the
          # newest as it was, not pointing at a commit with no bundle.
          gh release upload wasm "$mine" --clobber
          gh release upload wasm chaosrack-wasm.tar.gz --clobber
          # Keep the twenty newest commits' bundles. A binary older than that
          # is served the newest, and told so.
          gh release view wasm --json assets \
            --jq '[.assets[] | select(.name | test("^chaosrack-wasm-[0-9a-f]{12}\\.tar\\.gz$"))] | sort_by(.createdAt) | reverse | .[20:] | .[].name' |
            while read -r old; do gh release delete-asset wasm "$old" --yes; done
