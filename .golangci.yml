# Kept in step with 0pcom/skywire, which is the reference for these repos.
# The linter set and their settings are copied from there unchanged; what is
# dropped is only skywire's own path exclusions, which name files that do not
# exist here.
version: "2"
run:
  concurrency: 4
  modules-download-mode: vendor
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
linters:
  default: none
  enable:
    - errcheck
    - gocyclo
    - gosec
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    # Beyond skywire's set: the idioms this repo was brought up to, kept.
    - copyloopvar
    - errname
    - gocritic
    - intrange
    - predeclared
    - usestdlibvars
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: false
      check-blank: true
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      # A ratchet, not a target. Ten is the number this config has always
      # named and nothing has ever enforced; at ten the existing code fails
      # in dozens of places and the linter gets turned off again. Lower this
      # as the outliers come down — it went 50 to 45 when Run was split.
      min-complexity: 45
    lll:
      line-length: 120
      tab-width: 1
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    unparam:
      check-exported: false
    gocritic:
      enabled-tags: [diagnostic, style]
      disabled-checks:
        # Style opinions rather than idiom, or at odds with how this code is
        # written on purpose (long if/else ladders over mode names, unnamed
        # results on small helpers, large value receivers in hot math).
        - commentFormatting
        - commentedOutCode
        - deferInLoop
        - emptyStringTest
        - hugeParam
        - ifElseChain
        - importShadow
        - octalLiteral
        - paramTypeCombine
        - ptrToRefParam
        - regexpSimplify
        - singleCaseSwitch
        - sloppyLen
        - tooManyResultsChecker
        - typeUnparen
        - unlabelStmt
        - unnamedResult
        - whyNoLint
        - yodaStyleExpr
    revive:
      # A rules list runs ONLY the rules listed, so this is revive's default
      # set written out. It used to list one rule, disabled, which ran none.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
        # Off: js.FuncOf fixes every callback's signature, so most of them
        # cannot help having parameters they do not read.
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    paths:
      - vendor/
      - third_party/
      - node_modules
      - builtin$
      - examples$
    rules:
      # The staticcheck suggestions skywire turns off. They are style
      # preferences rather than defects, and the point of copying this file is
      # that the same code passes in both places.
      - linters:
          - staticcheck
        text: "QF1001:" # could apply De Morgan's law
      - linters:
          - staticcheck
        text: "QF1002:" # could use tagged switch
      - linters:
          - staticcheck
        text: "QF1003:" # could use tagged switch on error code
      - linters:
          - staticcheck
        text: "QF1004:" # could use strings.ReplaceAll instead
      - linters:
          - staticcheck
        text: "QF1006:" # could lift into loop condition
      - linters:
          - staticcheck
        text: "QF1008:" # could remove embedded field from selector
      - linters:
          - staticcheck
        text: "QF1010:" # could convert argument to string
      - linters:
          - staticcheck
        text: "QF1012:" # could use fmt.Fprintf instead of WriteString(fmt.Sprintf)
      - linters:
          - staticcheck
        text: "ST1005:" # error strings should not be capitalized
issues:
  new: false
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
